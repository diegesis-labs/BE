# Alembic 설정. 마이그레이션을 실행하는 방법은 migrations/env.py에 있다.
#
# 접속 주소(sqlalchemy.url)는 이 파일에 적지 않는다. env.py는 호출한 쪽이 넘긴 주소가 있으면 그것을,
# 없으면 설정 클래스(app/core/config.py)의 database_url을 쓴다. 설정값은 설정 클래스로만 읽기 때문이다
# (docs/CONFIGURATION.md 1절).

[alembic]
# 마이그레이션 스크립트가 있는 폴더. %(here)s는 이 파일이 있는 폴더다.
script_location = %(here)s/migrations

# env.py가 app 패키지를 import할 수 있도록 레포 최상위를 sys.path 앞에 넣는다.
prepend_sys_path = %(here)s

# prepend_sys_path와 version_locations의 경로를 나누는 문자. os는 os.pathsep을 쓴다.
path_separator = os


[post_write_hooks]

# 로그 설정. env.py가 읽는다.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
