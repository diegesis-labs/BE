# Alembic 설정. 마이그레이션을 실행하는 방법은 migrations/env.py에 있다.
#
# 접속 주소(sqlalchemy.url)는 이 파일에 적지 않는다. env.py는 호출한 쪽이 넘긴 주소가 있으면 그것을,
# 없으면 설정 클래스(app/core/config.py)의 database_url을 쓴다. 설정값은 설정 클래스로만 읽기 때문이다
# (docs/CONFIGURATION.md 1절).

[alembic]
# 마이그레이션 스크립트가 있는 폴더. %(here)s는 이 파일이 있는 폴더다.
script_location = %(here)s/migrations

# env.py가 app 패키지를 import할 수 있도록 레포 최상위를 sys.path 앞에 넣는다.
prepend_sys_path = %(here)s

# prepend_sys_path와 version_locations의 경로를 나누는 문자. os는 os.pathsep을 쓴다.
path_separator = os


[post_write_hooks]
# `alembic revision`이 만든 파일을 레포의 ruff 설정으로 고친다. 템플릿은 쓰지 않을 수도 있는
# import를 넣고 repr()로 작은따옴표를 쓰므로, 그대로 두면 scripts/check.sh를 통과하지 못한다.
# ruff는 개발 의존성이라 `uv run alembic revision ...`으로 실행한다.
#
# 설정 파일은 레포 최상위(cwd)에서 상대 경로로 넘긴다. Windows의 파이썬에서 alembic은 options를
# posix=False로 나누므로 따옴표가 값에 남아 ruff가 거부하고, alembic은 그 실패를 무시한다. 따옴표
# 없이 절대 경로를 넘기면 경로의 공백에서 값이 갈라진다. 리비전 파일의 경로는 나눈 뒤에 넣으므로
# 공백이 있어도 된다.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.cwd = %(here)s
ruff_check.options = check --fix --config pyproject.toml REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.cwd = %(here)s
ruff_format.options = format --config pyproject.toml REVISION_SCRIPT_FILENAME

# 로그 설정. env.py가 읽는다.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
