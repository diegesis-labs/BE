[project]
name = "diegesis-be"
version = "0.1.0"
description = "소설의 분위기에 맞는 음악을 재생해 주는 전자책 플랫폼 Diegesis의 백엔드"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# 아래 두 파일은 OnlineFourCut의 원본을 거의 그대로 옮긴 것이다.
# 원본과의 차이를 추적할 수 있도록 서식과 린트를 맞추지 않는다. pyright와 pytest는 그대로 건다.
# phases/ 아래는 step 지시와 리뷰 기록이다. 그 안의 코드 블록은 서식을 맞출 코드가 아니고,
# 리뷰가 틀린 구현의 예를 한 줄로 적으면 그것만으로 검사가 빨개진다.
extend-exclude = ["scripts/execute.py", "scripts/test_execute.py", "phases"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["app", "tests", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
# 비동기 테스트는 표시 없이 pytest-asyncio로 돈다. 이벤트 루프는 테스트마다 새로 만든다.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: testcontainers로 띄운 실제 PostgreSQL에서 도는 통합 테스트(docs/DEVELOPMENT.md 4.3절)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
]
