# 검사, compose 스모크, 컨테이너 이미지의 빌드와 Docker Hub push. 흐름과 GitHub에 등록하는 값의
# 이름은 docs/INFRA.md 3.7절에 있다. tests/infra/test_workflow.py가 아래 규칙을 확인한다.
#
# - main을 향한 PR과 main의 push에서만 돈다(docs/DECISIONS.md의 D-36). pull_request_target을 쓰지
#   않는다. 그 트리거는 PR의 코드를 secrets가 있는 맥락에서 돌린다.
# - 검사 명령은 scripts/check.sh 한 곳에만 둔다(docs/DEVELOPMENT.md 2절). 여기에 따로 적지 않는다.
# - 이미지는 main의 push에서, 검사와 스모크가 모두 통과한 뒤에만 올린다. PR에서는 빌드만 하고
#   secrets와 variable에 기대지 않는다. 등록하기 전에도, secrets를 받지 못하는 PR(Dependabot 등)에서도
#   빌드 확인은 초록이어야 하기 때문이다.
# - Docker Hub의 사용자 이름, 토큰, 이미지 이름은 secrets와 variable에서만 읽는다. 저장소가 공개라서
#   이 값을 파일에 적지 않는다(D-37). 이미지는 linux/amd64 하나만 올린다(D-37).
# - continue-on-error를 쓰지 않는다. 실패한 검사가 초록으로 보이기 때문이다.
# - 배포 환경에 새 이미지를 반영하는 단계는 배포할 곳이 정해진 뒤에 더한다(docs/INFRA.md 3.7절).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PR에 새 커밋이 오면 그 PR의 이전 실행을 취소한다. main의 push는 취소하지 않는다. 취소된 커밋의
# 이미지는 올라가지 않기 때문이다. 같은 그룹에서 기다리던 실행은 cancel-in-progress가 false여도 새
# 실행이 오면 취소되므로, main의 push는 실행마다 다른 그룹(run_id)에 둔다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uv의 버전은 Dockerfile이 복사해 오는 uv 이미지의 버전과 같아야 한다(docs/DEVELOPMENT.md 1절).
      # Python은 uv가 .python-version을 읽어 설치한다.
      # setup-uv는 v8부터 주 버전 태그(v8, v9, ...)를 두지 않으므로 정확한 버전 태그로 고정한다.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.6"
      - run: uv sync --locked
      # 통합 테스트도 여기서 돈다. ubuntu 실행기의 Docker로 testcontainers가 데이터베이스를 띄운다.
      - run: scripts/check.sh

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 이미지는 이 스크립트가 compose로 빌드한다(docs/DECISIONS.md의 D-41).
      - run: scripts/compose-smoke.sh

  image:
    needs: [check, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      # PR: 이미지가 빌드되는지만 확인한다. 태그를 붙이지 않고 올리지 않는다.
      - name: 이미지 빌드 (올리지 않음)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false

      # main의 push: 등록 여부를 확인하고, 로그인하고, 빌드해서 올린다.
      # variable이 비어 있으면 ':latest'처럼 이름 없는 태그가 되어 알아보기 어려운 오류로 끝나므로,
      # 로그인하기 전에 무엇을 등록해야 하는지 알리고 멈춘다.
      - name: DOCKERHUB_IMAGE 등록 확인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "::error::Actions variable DOCKERHUB_IMAGE가 비어 있어서 이미지를 올릴 수 없다."
            echo "레포의 Settings > Secrets and variables > Actions에서 아래 셋을 등록한 뒤 이 실행을 다시 돌려라(docs/INFRA.md 3.7절)."
            echo "  variable DOCKERHUB_IMAGE    이미지의 전체 이름(<Docker Hub 사용자 이름>/<저장소 이름>)"
            echo "  secret   DOCKERHUB_USERNAME Docker Hub의 사용자 이름"
            echo "  secret   DOCKERHUB_TOKEN    Read & Write 권한의 Docker Hub 액세스 토큰"
            exit 1
          fi

      - name: Docker Hub 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드와 push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:latest
            ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
